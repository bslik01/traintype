<html><head><base href="." /><title>Mon Site Web</title><meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css"  />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
    
      .auth-form {
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        margin-top: 5%;
      }
    
    </style>
    </head>
    <body>
      <div class="auth-form" id="authForm">
       
      </div>
      <script>
        class AuthUI {
          constructor() {
            this.isLogin = true;
            this.init();
          }
        
          init() {
            this.render();
            this.attachEvents();
          }
        
          render() {
            const authForm = document.getElementById('authForm');
            authForm.innerHTML = `
              <h2 class="text-center mb-4">${this.isLogin ? 'Connexion' : 'Inscription'}</h2>
              <form id="form">
                ${!this.isLogin ? `
                  <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" name="name" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Prénom</label>
                    <input type="text" class="form-control" name="firstname" required>
                  </div>
                ` : ''}
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Mot de passe</label>
                  <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-dark w-100">
                  ${this.isLogin ? 'Se connecter' : 'S\'inscrire'}
                </button>
              </form>
              <div class="form-switch content-center">
                <button class="btn btn-light w-100" id="switchBtn">
                  ${this.isLogin ? 'Créer un compte' : 'Déjà un compte ?'}
                </button>
              </div>
            `;
          }
        
          attachEvents() {
            document.getElementById('switchBtn').addEventListener('click', () => {
              this.isLogin = !this.isLogin;
              this.render();
              this.attachEvents();
            });
        
            document.getElementById('form').addEventListener('submit', (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              const data = Object.fromEntries(formData.entries());
              
              // Simulation d'une requête API
              console.log('Données envoyées:', data);
              alert(`${this.isLogin ? 'Connexion' : 'Inscription'} réussie !`);
            });
          }
        }
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
          new AuthUI();
        });
        </script>
    </body></html>

<html>
  <head>
    <base href="." /><title>Progression du Joueur - Vitesse de Frappe</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/stat.css">
    
  </head>
    <body>
    <div class="container">
      <h1>Progression du Joueur</h1>
    
      <div class="stats-card">
        <div class="stat-item">
          <div class="stat-value" id="averageWpm">0</div>
          <div class="stat-label">Moyenne MPM</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="bestWpm">0</div>
          <div class="stat-label">Record MPM</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalGames">0</div>
          <div class="stat-label">Parties Jouées</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="progression">0%</div>
          <div class="stat-label">Progression</div>
        </div>
      </div>
    
      <div class="chart-container">
        <canvas id="progressChart"></canvas>
      </div>
    </div>
    
    <script src="../js/stat.js"></script>
    </body></html>
